name: Bar Oratorio
version: "1.0.0"
slug: bar_oratorio
description: Inventario del bar dell'oratorio, con link dedicato tramite Tailscale Funnel
url: https://github.com/Alessiofont/ha-bar-oratorio
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
webui: "http://[HOST]:[PORT:8080]/"
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Accesso diretto dalla rete locale (facoltativo, senza https)
options:
  admin_username: oratorio
  admin_password: ""
  admin_reset: false
  tailscale_enabled: true
  tailscale_authkey: ""
  tailscale_hostname: bar-oratorio
  funnel: true
  session_days: 365
schema:
  admin_username: "match(^[a-z0-9._-]{2,32}$)"
  admin_password: password
  admin_reset: bool
  tailscale_enabled: bool
  tailscale_authkey: "password?"
  tailscale_hostname: "match(^[a-z0-9-]{1,63}$)"
  funnel: bool
  session_days: "int(1,3650)"
